<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Soft Soothing Ambient Sky Gradient (Eye-Comfort Tranquil Pearl & Misty Slate) -->
    <linearGradient id="soothingSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0f8"/>
      <stop offset="38%" stop-color="#dde7f2"/>
      <stop offset="70%" stop-color="#d3e0ed"/>
      <stop offset="100%" stop-color="#c6d5e6"/>
    </linearGradient>

    <!-- Gentle Ambient Glows (Serene Cyan & Tranquil Mint) -->
    <radialGradient id="softCyanGlow" cx="22%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c6d5e6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="softEmeraldGlow" cx="82%" cy="26%" r="58%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.20"/>
      <stop offset="45%" stop-color="#10b981" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#c6d5e6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="softAmberGlow" cx="50%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.16"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c6d5e6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="softIndigoGlow" cx="12%" cy="75%" r="48%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c6d5e6" stop-opacity="0"/>
    </radialGradient>

    <!-- Calming Fine Perspective Grid Pattern -->
    <pattern id="calmGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148, 163, 184, 0.16)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(56, 189, 248, 0.25)"/>
    </pattern>

    <!-- Smooth Flowing Organic Wave Ribbons -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#34d399" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.16"/>
    </linearGradient>

    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.14"/>
    </linearGradient>

    <!-- Gentle Financial Trend Chart Stroke Gradient -->
    <linearGradient id="chartStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- Eye-Soothing Base Sky -->
  <rect width="100%" height="100%" fill="url(#soothingSky)"/>

  <!-- Ambient Light Fields -->
  <rect width="100%" height="100%" fill="url(#softCyanGlow)"/>
  <rect width="100%" height="100%" fill="url(#softEmeraldGlow)"/>
  <rect width="100%" height="100%" fill="url(#softAmberGlow)"/>
  <rect width="100%" height="100%" fill="url(#softIndigoGlow)"/>

  <!-- Calming Perspective Grid -->
  <rect width="100%" height="100%" fill="url(#calmGrid)"/>

  <!-- Soothing 3D Geometric Financial Wave -->
  <path d="M-120,620 C280,480 620,740 1080,590 C1540,440 1780,690 2080,570 L2080,1200 L-120,1200 Z" fill="url(#wave1)"/>
  <path d="M-120,720 C320,600 680,820 1180,670 C1620,540 1840,780 2080,650 L2080,1200 L-120,1200 Z" fill="url(#wave2)"/>

  <!-- Floating Financial Trend Trajectory Curve -->
  <path d="M60,480 Q320,380 580,420 T1040,310 T1480,240 T1880,180" fill="none" stroke="url(#chartStroke)" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Soft Luminous Accents & Nodes -->
  <g fill="#0284c7" opacity="0.5">
    <circle cx="580" cy="420" r="4"/>
    <circle cx="1040" cy="310" r="4.5"/>
    <circle cx="1480" cy="240" r="4"/>
    <circle cx="1880" cy="180" r="5"/>
  </g>

  <!-- Gentle Sparkle Stars with Warm Honey/Cyan Glow -->
  <g stroke="#d97706" stroke-width="1.5" opacity="0.45">
    <line x1="1040" y1="298" x2="1040" y2="322"/>
    <line x1="1028" y1="310" x2="1052" y2="310"/>

    <line x1="420" y1="180" x2="420" y2="200"/>
    <line x1="410" y1="190" x2="430" y2="190"/>

    <line x1="1620" y1="140" x2="1620" y2="160"/>
    <line x1="1610" y1="150" x2="1630" y2="150"/>
  </g>
</svg>
